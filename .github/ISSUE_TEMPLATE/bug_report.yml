name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for the report. Do not paste secret keys, API keys, webhook secrets or seed phrases. Security issues go through private reporting (see SECURITY.md)."
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - components
        - hooks
        - wallet adapter
        - theme / styling
        - demo storefront + hosted checkout
        - docs
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "v0.1.0 or a commit SHA"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, requests or code. Testnet only.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Redact anything secret.
      render: shell
